name: Build

on:
  push:
    branches: [main, develop, feat/unified-business-identity]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, customer-web, admin-dashboard, adforge]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Build ${{ matrix.app }}
        run: npm --workspace apps/${{ matrix.app }} run build
