name: Build

on:
  push:
    branches: [main, develop, feat/reliability-main-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  app-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [api, customer-web, admin-dashboard]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

  reliability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reliability package
        run: pnpm --filter khakadx-reliability build

      - name: Test reliability package
        run: pnpm --filter khakadx-reliability test
