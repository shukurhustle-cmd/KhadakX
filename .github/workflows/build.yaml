name: Build

on:
  push:
    branches: [main, develop, feat/unified-business-identity, chore/reconcile-unified-business-identity]
  pull_request:
    branches: [main, chore/reconcile-unified-business-identity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, customer-web, admin-dashboard, adforge]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build

      - name: Run API authorization tests
        if: matrix.app == 'api'
        run: pnpm --filter api test -- --runInBand

      - name: Run API runtime E2E
        if: matrix.app == 'api'
        run: pnpm --filter api test -- --runInBand src/integrations/adforge/adforge.live-e2e.spec.ts
