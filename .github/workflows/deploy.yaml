name: Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Render is the production deployment platform for KhadakX.
# This workflow deliberately does NOT deploy to Vercel.
# Production deployment remains subject to the release Control Plane and Render gates.

jobs:
  verify-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Record exact release SHA
        run: |
          echo "RELEASE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "Verified release candidate: ${GITHUB_SHA}"
