services:
  - type: web
    name: khakadx-web
    runtime: node
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter khakadx-web build
    startCommand: pnpm --filter khakadx-web start
    envVars:
      - key: NODE_VERSION
        value: 20.19.1
      - key: NEXT_PUBLIC_API_URL
        value: https://khakadx-api.onrender.com
